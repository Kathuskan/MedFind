version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: medfind_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medfind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medfind_password}
      POSTGRES_DB: ${POSTGRES_DB:-medfind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medfind_user} -d ${POSTGRES_DB:-medfind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medfind_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-medfind_user}:${POSTGRES_PASSWORD:-medfind_password}@db:5432/${POSTGRES_DB:-medfind_db}
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-super-secret-random-key-in-production-min-32-chars}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medfind_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
