[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medfind-backend"
version = "0.1.0"
description = "FastAPI backend for MedFind real-time pharmacy search and stock reservation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MedFind Team", email = "dev@medfind.local" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.6.4",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "aiosqlite>=0.20.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
