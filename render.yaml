# Short-lived synthetic demonstration. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: medfind-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/hosted.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medfind-demo-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
databases:
  - name: medfind-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: medfind
    user: medfind
    ipAllowList: []
