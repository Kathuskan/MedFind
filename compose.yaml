# Local demonstration only. Supply POSTGRES_PASSWORD through an untracked .env.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medfind
      POSTGRES_USER: medfind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - medfind_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medfind -d medfind']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://medfind:${POSTGRES_PASSWORD}@db:5432/medfind
      DEMO_MODE: 'true'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports: ['127.0.0.1:8080:80']
    depends_on:
      api:
        condition: service_healthy
volumes:
  medfind_db:
