name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medfind
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: medfind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U medfind -d medfind_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://medfind:ci-only-password@localhost:5432/medfind_test
      TEST_DATABASE_URL: postgresql+psycopg://medfind:ci-only-password@localhost:5432/medfind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check app tests migrations
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
