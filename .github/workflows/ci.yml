name: MedFind CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medfind_user
          POSTGRES_PASSWORD: medfind_password
          POSTGRES_DB: medfind_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e .

      - name: Lint with Ruff
        working-directory: ./backend
        run: |
          ruff check .

      - name: Run Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://medfind_user:medfind_password@localhost:5432/medfind_test_db
          SECRET_KEY: test-secret-key-12345678901234567890
        run: |
          pytest app/tests/ -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Check TypeScript & Build
        working-directory: ./frontend
        run: npm run build
